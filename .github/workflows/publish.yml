# Publishes the crate to crates.io when a release tag is pushed. The release itself (tag and
# GitHub release) is made by hand as before; this workflow only uploads the package. Without the
# CRATES_IO_TOKEN secret it skips the upload and succeeds.
name: publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # By hand, to publish an existing release tag that predates this workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to publish (vX.Y.Z)
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Check the tag matches the manifest version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          tag_version="${tag#v}"
          if [ "$tag_version" != "$version" ]; then
            echo "::error::tag $tag does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "tag $tag matches Cargo.toml version $version"

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -eu
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CRATES_IO_TOKEN not set; skipping crates.io publish"
            exit 0
          fi
          cargo publish --locked
